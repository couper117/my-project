<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiz App</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-6">
  <div class="flex gap-6">
    <div class="w-2/3 bg-white shadow-md rounded-md p-4">
      <h1 class="text-2xl font-bold mb-4">Payment Information</h1>
      <form action="" class="flex flex-col gap-4">
        <div>
          <label for="name" class="block font-medium">Name on card</label>
          <input type="text" id="name" name="name" class="border border-gray-300 rounded-md p-2 w-full">
        </div>
        <div>
          <label for="card-number" class="block font-medium">Card number</label>
          <input type="text" id="card-number" name="card-number" class="border border-gray-300 rounded-md p-2 w-full">
        </div>
        <div class="flex gap-2">
          <input type="text" id="year" name="year" placeholder="Year" class="border border-gray-300 rounded-md p-2 w-1/3">
          <input type="text" id="month" name="month" placeholder="Month" class="border border-gray-300 rounded-md p-2 w-1/3">
          <input type="text" id="cvc" name="cvc" placeholder="CVC" class="border border-gray-300 rounded-md p-2 w-1/3">
        </div>
        <button type="submit" class="bg-blue-500 text-white rounded-md p-2 hover:bg-blue-600">
          Confirm Payment
        </button>
      </form>
    </div>

    <div class="w-1/3 bg-white shadow-md rounded-md p-4">
      <h2 class="text-xl font-bold mb-4">Order Summary</h2>
      <ul class="space-y-2">
        <li class="flex justify-between">
          <span>title1</span>
          <span>$90</span>
        </li>
        <li class="flex justify-between">
          <span>title2</span>
          <span>$5</span>
        </li>
      </ul>
    </div>
  </div>
</body>
</html>
