<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>User Management</title>
  <script src="https://cdn.tailwindcss.com"></script>

  <script>
    tailwind.config = {
      darkMode: 'class' }
  </script>
</head>
<body class="bg-gray-100 dark:bg-gray-900 min-h-screen p-6 transition-colors duration-300">
  <div class="max-w-7xl mx-auto bg-white dark:bg-gray-800 rounded-xl shadow-lg p-6">
    <div class="flex justify-between items-center mb-6 border-b pb-4 border-gray-200 dark:border-gray-700">
      <h1 class="text-2xl font-bold text-gray-800 dark:text-white">
        User Management
      </h1>
      <button id="toggleDark"
        class="px-4 py-2 rounded bg-gray-800 text-white dark:bg-white dark:text-black">
        Toggle Dark Mode
      </button>
    </div>
    <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
      <form id="userForm"
        class="bg-gray-50 dark:bg-gray-700 dark:text-white p-6 rounded-lg shadow space-y-3">
<h2 class="text-lg font-bold">New User</h2>
        <h3 class="text-lg font-medium">First Name</h3>
        <input id="firstName" placeholder="First Name"
          class="w-full border px-2 py-1 rounded text-black dark:text-white dark:bg-gray-600" required>
          <h3 class="text-lg font-medium">Last Name</h3>
        <input id="lastName" placeholder="Last Name"
          class="w-full border px-2 py-1 rounded text-black dark:text-white dark:bg-gray-600" required>
          <h3 class="text-lg font-medium">Gender</h3>
        <div class="flex gap-4">
          <label><input type="radio" name="gender" value="Male" required> Male</label>
          <label><input type="radio" name="gender" value="Female"> Female</label>
        </div>
        <h3 class="text-lg font-medium">Password</h3>
        <input id="password" type="password" placeholder="Password"
          class="w-full border px-2 py-1 rounded text-black dark:text-white dark:bg-gray-600" required>

        <button class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700 transition">
          Submit
        </button>
<p id="feedback" class="hidden mt-3 font-medium"></p>
      </form>
      <div class="bg-gray-50 dark:bg-gray-700 dark:text-white p-6 rounded-lg shadow overflow-x-auto">
        <h2 class="text-lg font-bold mb-3">Users List</h2>
        <table class="w-full border min-w-[500px]">
          <thead class="bg-gray-200 dark:bg-gray-600">
            <tr>
              <th class="border px-2 py-1">No</th>
              <th class="border px-2 py-1">First</th>
              <th class="border px-2 py-1">Last</th>
              <th class="border px-2 py-1">Gender</th>
              <th class="border px-2 py-1">Status</th>
              <th class="border px-2 py-1">Action</th>
            </tr>
          </thead>
          <tbody id="usersTable"></tbody>
        </table>
      </div>
    </div>
  </div>
  <script>
    const form = document.getElementById('userForm');
    const tbody = document.getElementById('usersTable');
    const feedback = document.getElementById('feedback');
    const toggleDark = document.getElementById('toggleDark');

    let users = [];
    if (localStorage.getItem("theme") === "dark") {
      document.documentElement.classList.add("dark");
    }
  toggleDark.addEventListener("click", () => {
      document.documentElement.classList.toggle("dark");

      localStorage.setItem(
        "theme",
        document.documentElement.classList.contains("dark") ? "dark" : "light"
      );
    }); function renderTable() {
      tbody.innerHTML = "";

      users.forEach((user, index) => {
        tbody.innerHTML += `
          <tr>
            <td class="border px-2 py-1">${index + 1}</td>
            <td class="border px-2 py-1">${user.first}</td>
            <td class="border px-2 py-1">${user.last}</td>
            <td class="border px-2 py-1">${user.gender}</td>
            <td class="border px-2 py-1">Active</td>
            <td class="border px-2 py-1">
              <button onclick="deleteUser(${index})"
                class="text-red-500 hover:underline">
                Delete
              </button>
            </td>
          </tr>
        `;
      });
    }

    window.deleteUser = function(index) {
      const confirmDelete = confirm("Are you sure you want to delete this user?");
      if (!confirmDelete) return;

      users.splice(index, 1);
      renderTable();
    }

    form.addEventListener('submit', e => {
      e.preventDefault();

      const first = document.getElementById('firstName').value.trim();
      const last = document.getElementById('lastName').value.trim();
      const password = document.getElementById('password').value.trim();
      const genderInput = document.querySelector('input[name="gender"]:checked');

      if (!first || !last || !password || !genderInput) {
        feedback.textContent = "Please fill in all fields correctly.";
        feedback.className = "mt-3 text-red-500 font-medium";
        feedback.classList.remove("hidden");
        return;
      }
      if (password.length < 6) {
        feedback.textContent = "Password must be at least 6 characters.";
        feedback.className = "mt-3 text-red-500 font-medium";
        feedback.classList.remove("hidden");
        return;
      }
const exists = users.some(
        u => u.first.toLowerCase() === first.toLowerCase() &&
             u.last.toLowerCase() === last.toLowerCase()
      );

      if (exists) {
        feedback.textContent = "User already exists!";
        feedback.className = "mt-3 text-red-500 font-medium";
        feedback.classList.remove("hidden");
        return;
      }

      users.push({
        first,
        last,
        gender: genderInput.value
      });

      feedback.textContent = "User added successfully!";
      feedback.className = "mt-3 text-green-500 font-medium";
      feedback.classList.remove("hidden");

      form.reset();
      renderTable();
    });
  </script>

</body>
</html>
