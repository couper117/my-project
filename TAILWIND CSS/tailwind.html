<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IRIMS Portal - Tailwind Version</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        #map { height: 600px; width: 100%; }
    </style>
</head>
<body class="bg-gray-100 font-sans">

    <nav class="flex items-center justify-between bg-white px-8 py-3 border-b border-gray-200">
        <div class="flex items-center space-x-3">
            <div class="w-8 h-8 bg-blue-600 rounded-full"></div>
            <div>
                <span class="font-bold text-blue-700 text-lg">IRIMS</span>
                <span class="text-gray-400 text-xs ml-2">Customer Self Service Portal</span>
            </div>
        </div>
        <div class="flex items-center space-x-4">
            <span class="font-semibold text-sm text-gray-700">MR. NIYONGABO</span>
            <div class="w-10 h-10 bg-yellow-400 rounded-full border-2 border-white shadow-sm"></div>
        </div>
    </nav>

    <div class="p-6">
        <div class="max-w-7xl mx-auto bg-white rounded-2xl shadow-xl overflow-hidden flex flex-col md:flex-row">
            
            <div class="w-full md:w-1/3 p-8 border-r border-gray-100">
                <h2 class="font-bold text-gray-800 mb-6 uppercase tracking-wide">Request for Premise License</h2>

                <div class="flex items-center bg-orange-50 border border-orange-100 rounded-full px-4 py-3 mb-8">
                    <div class="w-7 h-7 bg-white text-orange-500 rounded-full flex items-center justify-center font-bold mr-3 shadow-sm">1</div>
                    <div>
                        <p class="text-sm font-bold text-gray-800">Premise Details</p>
                        <p class="text-xs text-gray-500">License details</p>
                    </div>
                </div>

                <div class="space-y-5">
                    <div>
                        <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Premise Name or Site Location</label>
                        <input type="text" placeholder="Enter name" class="w-full border border-gray-300 rounded-md px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 outline-none">
                    </div>

                    <div>
                        <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Choose country</label>
                        <select class="w-full border border-gray-300 rounded-md px-3 py-2 text-sm bg-gray-50">
                            <option>Rwanda</option>
                        </select>
                    </div>

                    <div>
                        <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Search for location</label>
                        <div class="relative">
                            <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-gray-400">🔍</span>
                            <input type="text" value="Kimi" class="w-full border border-gray-300 rounded-md pl-10 pr-3 py-2 text-sm">
                        </div>
                        <ul class="mt-2 ml-8 text-sm text-gray-500 space-y-1">
                            <li class="hover:text-blue-600 cursor-pointer">Kimihurura</li>
                            <li class="hover:text-blue-600 cursor-pointer">Kimironko</li>
                            <li class="hover:text-blue-600 cursor-pointer">Kimisagara</li>
                        </ul>
                    </div>
                </div>

                <button class="w-full mt-10 bg-blue-700 hover:bg-blue-800 text-white font-bold py-3 rounded-lg transition duration-200 shadow-md">
                    Next
                </button>
            </div>

            <div class="w-full md:w-2/3 relative">
                <div id="map"></div>
            </div>

        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // Satellite Map Logic (Same as before)
        var map = L.map('map', { zoomControl: false }).setView([-1.9441, 30.0619], 16);
        L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}').addTo(map);
        L.marker([-1.9441, 30.0619]).addTo(map);
    </script>
</body>
</html>
