<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FreshMart Rwanda | Management</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-50 min-h-screen font-sans text-gray-800">

    <nav class="bg-green-700 text-white shadow-lg sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16 items-center">
                <div class="flex-shrink-0 flex items-center cursor-pointer" onclick="navigate('shop')">
                    <h1 class="font-extrabold text-2xl tracking-tight">Fresh<span class="text-yellow-400">Mart</span>
                    </h1>
                </div>
                <div class="flex space-x-4 items-center">
                    <button onclick="navigate('shop')"
                        class="hover:text-yellow-300 font-medium transition">Shop</button>

                    <div id="auth-links" class="hidden flex space-x-4 items-center">
                        <button onclick="navigate('add-product')"
                            class="bg-yellow-400 text-green-900 px-4 py-2 rounded-md font-bold hover:bg-yellow-300 transition">+
                            Add Item</button>
                        <button onclick="logout()" class="text-red-200 hover:text-white transition">Logout</button>
                    </div>

                    <div id="guest-links" class="flex space-x-4 items-center">
                        <button onclick="navigate('login')" class="hover:text-yellow-300 transition">Login</button>
                        <button onclick="navigate('register')"
                            class="bg-white text-green-700 px-4 py-2 rounded-md font-bold hover:bg-gray-100 transition">Register</button>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">

        <section id="section-shop" class="active-section">
            <div class="flex flex-col md:flex-row justify-between items-center mb-8 gap-4">
                <h2 class="text-3xl font-bold text-gray-900">Our Inventory</h2>
                <div class="w-full md:w-1/3">
                    <input type="text" id="searchInput" placeholder="Search products..."
                        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500 focus:border-transparent outline-none transition">
                </div>
            </div>

            <div id="product-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6"></div>
        </section>

        <section id="section-login"
            class="hidden max-w-md mx-auto bg-white p-8 rounded-xl shadow-md border border-gray-100">
            <h2 class="text-2xl font-bold mb-6 text-center text-gray-900">Welcome Back</h2>
            <form id="loginForm" class="space-y-5">
                <div>
                    <label class="block text-sm font-medium text-gray-700">Email</label>
                    <input type="email" id="loginEmail" required
                        class="mt-1 w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-green-500 focus:border-green-500">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">Password</label>
                    <input type="password" id="loginPassword" required
                        class="mt-1 w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-green-500 focus:border-green-500">
                </div>
                <button type="submit"
                    class="w-full flex justify-center py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-green-600 hover:bg-green-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-green-500">Sign
                    In</button>
            </form>
        </section>

        <section id="section-register"
            class="hidden max-w-md mx-auto bg-white p-8 rounded-xl shadow-md border border-gray-100">
            <h2 class="text-2xl font-bold mb-6 text-center text-gray-900">Create an Account</h2>
            <form id="registerForm" class="space-y-5">
                <div>
                    <label class="block text-sm font-medium text-gray-700">Full Name</label>
                    <input type="text" id="regName" required
                        class="mt-1 w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-green-500 focus:border-green-500">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">Email</label>
                    <input type="email" id="regEmail" required
                        class="mt-1 w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-green-500 focus:border-green-500">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">Password</label>
                    <input type="password" id="regPassword" required
                        class="mt-1 w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-green-500 focus:border-green-500">
                </div>
                <button type="submit"
                    class="w-full flex justify-center py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-green-600 hover:bg-green-700">Register</button>
            </form>
        </section>

        <section id="section-add-product"
            class="hidden max-w-2xl mx-auto bg-white p-8 rounded-xl shadow-md border border-gray-100">
            <h2 class="text-2xl font-bold mb-6 text-center text-green-700">Add to Inventory</h2>
            <form id="addProductForm" class="space-y-5">
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-5">
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Product Name</label>
                        <input type="text" id="prodName" required
                            class="mt-1 w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-green-500">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Price (RWF)</label>
                        <input type="number" id="prodPrice" required
                            class="mt-1 w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-green-500">
                    </div>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">Category</label>
                    <select id="prodCategory" required
                        class="mt-1 w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-green-500">
                        <option value="Vegetables">Vegetables</option>
                        <option value="Fruits">Fruits</option>
                        <option value="Dairy">Dairy</option>
                        <option value="Bakery">Bakery</option>
                        <option value="Meat">Meat</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">Description</label>
                    <textarea id="prodDescription" rows="3"
                        class="mt-1 w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-green-500"></textarea>
                </div>
                <div class="border-2 border-dashed border-gray-300 rounded-md p-6 text-center">
                    <label class="block text-sm font-medium text-gray-700 mb-2 cursor-pointer">Upload Image
                        (Cloudinary)</label>
                    <input type="file" id="prodImage" accept="image/*" required
                        class="w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-green-50 file:text-green-700 hover:file:bg-green-100">
                </div>
                <button type="submit"
                    class="w-full flex justify-center py-3 px-4 border border-transparent rounded-md shadow-sm text-lg font-bold text-white bg-green-600 hover:bg-green-700">Save
                    Product</button>
            </form>
        </section>

    </main>

    <script src="script.js"></script>
</body>

</html>
