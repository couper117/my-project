<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register Admin | FreshMart</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-slate-900 flex items-center justify-center min-h-screen">

    <div class="bg-slate-800 p-8 rounded-xl shadow-2xl w-full max-w-md border border-slate-700">
        <h2 class="text-3xl font-bold text-white text-center mb-2">Create Admin</h2>
        <p class="text-slate-400 text-center mb-8 text-sm">Register to manage the supermarket inventory</p>

        <form id="registerForm" class="space-y-5">
            <div>
                <label class="block text-sm font-medium text-slate-300 mb-2">Full Name</label>
                <input type="text" id="name" required
                    class="w-full px-4 py-3 bg-slate-700 border border-slate-600 rounded-lg text-white focus:ring-2 focus:ring-blue-500 outline-none transition-all">
            </div>

            <div>
                <label class="block text-sm font-medium text-slate-300 mb-2">Email Address</label>
                <input type="email" id="email" required
                    class="w-full px-4 py-3 bg-slate-700 border border-slate-600 rounded-lg text-white focus:ring-2 focus:ring-blue-500 outline-none transition-all">
            </div>

            <div>
                <label class="block text-sm font-medium text-slate-300 mb-2">Password</label>
                <input type="password" id="password" required
                    class="w-full px-4 py-3 bg-slate-700 border border-slate-600 rounded-lg text-white focus:ring-2 focus:ring-blue-500 outline-none transition-all">
            </div>

            <button type="submit"
                class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-lg shadow-lg transition-all active:scale-95">
                Register Admin Account
            </button>
        </form>

        <div class="mt-6 flex flex-col items-center gap-3">
            <a href="login.html" class="text-blue-400 hover:text-blue-300 text-sm font-medium">Already have an account?
                Login</a>
            <a href="index.html" class="text-slate-500 hover:text-slate-300 text-xs transition">← Back to Storefront</a>
        </div>

        <p id="message" class="mt-4 text-center text-sm font-semibold"></p>
    </div>

    <script>
        const registerForm = document.getElementById('registerForm');
        const messageBox = document.getElementById('message');

        registerForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            const name = document.getElementById('name').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            try {
                const response = await fetch('http://localhost:5000/api/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, email, password })
                });

                const data = await response.json();

                if (response.ok) {
                    messageBox.className = "mt-4 text-center text-green-400";
                    messageBox.innerText = "Registration Successful! Redirecting to login...";
                    setTimeout(() => window.location.href = 'login.html', 2000);
                } else {
                    messageBox.className = "mt-4 text-center text-red-400";
                    messageBox.innerText = data.message || "Registration Failed";
                }
            } catch (error) {
                messageBox.className = "mt-4 text-center text-yellow-400";
                messageBox.innerText = "Error: Backend unreachable.";
            }
        });
    </script>
</body>

</html>
